<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121614">
  <title>Elderwild Web</title>
  <link rel="stylesheet" href="styles.css?v=20260908-3">
  <style>
    :root{--panel:#1b211e!important;--panel2:#252d29!important;--gold:#72d88d!important;--green:#57c879!important;--red:#a84d4d!important}
    html,body{background:radial-gradient(circle at top,#252b28 0,#111513 58%)!important;color:#edf4ef!important}
    button{color:#edf4ef!important}
    .topbar{background:rgba(17,21,19,.97)!important;border-bottom-color:#3b5144!important}
    .topbar h1,.hero h2,.panel h2,.inventory-slot .qty{color:#72d88d!important}
    .subtitle,.player-summary span,.muted,.activity-copy span{color:#a7b5ab!important}
    .hero,.panel,.card{background:linear-gradient(#252c29,#181d1b)!important;border-color:#3d5145!important}
    .card button,.action-button{background:#27332c!important;border-color:#4f735d!important;color:#edf4ef!important}
    .action-button.active,.nav-button.active{color:#7ee99b!important;border-color:#65cc82!important}
    .xpbar,.progress-track{background:#243027!important;border-color:#3d5846!important}
    .xpfill,.progress-fill{background:#57c879!important}
    .activity-card,.inventory-slot{background:#171c19!important;border-color:#35493d!important}
    .bottom-nav{background:#101412!important;border-top-color:#3b5144!important}
    .nav-button{color:#9eaaa2!important}
    .activity-bar{background:#1b211e!important;border-color:#4f735d!important}
    .danger-button{background:#4a2626!important;border-color:#754141!important}
    .settings-row{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;width:100%!important;align-items:stretch!important}
    .settings-row input{display:block!important;width:100%!important;min-width:0!important;background:#111513!important;color:#edf4ef!important;border-color:#466050!important}
    .settings-row>.action-button{width:auto!important;min-width:max-content!important;padding-left:14px!important;padding-right:14px!important}
    @media(max-width:420px){.settings-row{grid-template-columns:1fr!important}.settings-row>.action-button{width:100%!important}}
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1>Elderwild</h1>
        <p class="subtitle">ScapeRunner web conversion</p>
      </div>
      <div class="player-summary">
        <strong id="player-name">Adventurer</strong>
        <span id="total-level">Total 12</span>
      </div>
    </header>

    <main id="view" class="view"></main>

    <section id="activity-bar" class="activity-bar hidden" aria-live="polite">
      <div class="activity-copy">
        <strong id="activity-name"></strong>
        <span id="activity-status"></span>
      </div>
      <div class="progress-track"><div id="activity-progress" class="progress-fill"></div></div>
      <button id="stop-activity" class="danger-button">Stop</button>
    </section>

    <nav class="bottom-nav">
      <button data-view="home" class="nav-button active">Home</button>
      <button data-view="skills" class="nav-button">Skills</button>
      <button data-view="combat" class="nav-button">Combat</button>
      <button data-view="inventory" class="nav-button">Inventory</button>
      <button data-view="settings" class="nav-button">Settings</button>
    </nav>
  </div>

  <script type="module" src="src/app.js?v=20260908-3"></script>
</body>
</html>
