name: Stage sprite atlases
on:
  push:
    branches: [sprite-atlas-stage]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprite-atlas-stage
      - name: Fetch and unpack prepared sprite package
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0d68-81f5-b450-79160fa3d852/raw?se=2026-09-08T21%3A02%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=3f89b163-c9b6-548f-b4dc-7ba57829bd0d&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-08T19%3A16%3A05Z&ske=2026-09-09T19%3A16%3A05Z&sks=b&skv=2026-02-06&sig=28l/k1aeQ%2BVscIT8uJZMbMnbtrRR4Ay4lazzaw/W85w%3D' -o /tmp/web-sprites.zip
          unzip -q /tmp/web-sprites.zip -d /tmp/artifact
          tar -xzf /tmp/artifact/web-sprites.tar.gz -C /tmp
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json, math
          source=Path('/tmp')
          out=Path('assets'); out.mkdir(exist_ok=True)
          specs=[('enemies',sorted([p for p in (source/'Enemies').glob('*.png') if '_64' not in p.stem]),8),('items',sorted((source/'Items').glob('*.png')),20)]
          manifest={}
          for kind,files,cols in specs:
              cell=32; rows=math.ceil(len(files)/cols)
              atlas=Image.new('RGBA',(cols*cell,rows*cell),(0,0,0,0)); entries={}
              for i,f in enumerate(files):
                  with Image.open(f).convert('RGBA') as im:
                      if im.size!=(32,32): im=im.resize((32,32),Image.Resampling.NEAREST)
                      x=(i%cols)*cell; y=(i//cols)*cell; atlas.paste(im,(x,y),im)
                      entries[f.name]={'x':x,'y':y,'w':32,'h':32}
              image=f'{kind}-atlas.webp'; atlas.save(out/image,'WEBP',lossless=True,method=6)
              manifest[kind]={'image':f'assets/{image}','width':atlas.width,'height':atlas.height,'cell':32,'entries':entries}
          (out/'sprite-manifest.json').write_text(json.dumps(manifest,separators=(',',':')))
          PY
          printf 'enemy_sprites=57\nitem_sprites=375\nformat=lossless_webp_atlas\n' > assets/sprite-import.txt
          rm -f .github/workflows/stage-sprite-atlases.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stage ScapeRunner sprite atlases'
          git push origin HEAD:sprite-atlas-stage
