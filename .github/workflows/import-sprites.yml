URLS
          rm -f /tmp/chunk_*
          i=0
          while IFS= read -r url; do
            file=$(printf '/tmp/chunk_%03d' "$i")
            curl -fL --retry 3 --retry-delay 1 "$url" -o "$file"
            i=$((i+1))
          done < /tmp/urls.txt
          cat /tmp/chunk_* > /tmp/web-sprites.tar.gz.b64
          base64 -d /tmp/web-sprites.tar.gz.b64 > /tmp/web-sprites.tar.gz
          rm -rf assets/Enemies assets/Items assets/enemies assets/items
          mkdir -p assets
          tar -xzf /tmp/web-sprites.tar.gz -C assets
          mv assets/Enemies assets/enemies
          mv assets/Items assets/items
          printf 'enemy_files=%s\nitem_files=%s\n' "$(find assets/enemies -type f | wc -l)" "$(find assets/items -type f | wc -l)" > assets/sprite-import.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Stage imported ScapeRunner sprites"
          git push origin HEAD:sprite-import-temp
