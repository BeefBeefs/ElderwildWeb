name: Import sprites

on:
  push:
    branches: [sprite-import-temp]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sprite-import-temp
      - name: Download and unpack sprites
        shell: bash
        run: |
          set -euo pipefail
          if [ -d assets/enemies ] && [ -d assets/items ]; then
            echo "Sprites already imported."
            exit 0
          fi
          cat > /tmp/urls.txt <<'URLS'
https://raw.githubusercontent.com/BeefBeefs/ScapeRunner/web-asset-export/web-export/chunk_000?token=AY3T7K6MBDJAKQWKM3RAY6DKUB2BHAA
